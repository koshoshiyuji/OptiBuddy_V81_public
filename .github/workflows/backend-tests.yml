name: Backend Tests (CP-SAT engine)

# 2026-08-21新規追加: OptiBuddy_V81_public限定のCI。
#
# 【スコープ】CP-SATエンジン経路のみを対象とする。CPLEX/CP Optimizer
# (docplex/cplex)はGitHub Actionsの標準ランナーにインストール・ライセンス
# されていないため、CPLEX依存のテストはこのCIでは検証しない
# (それらはpytest.importorskip / skipif(not HAS_DOCPLEX)で自動的にスキップ
# される設計に既になっている。Backend/solvers/base/test_ce_limit_mip_fallback.py
# などの冒頭コメント参照)。CPLEX経路の検証は引き続きKoshoshiのmacOS開発環境
# (docplex/cplexインストール済み)で手動実施する。
#
# 【public repoのみで実行する理由】単一コードベース方針により
# OptiBuddy_V81_public は全27ドメインのコードを含んでいるため、テスト対象は
# private版(OptiBuddy_V81)と変わらない。public repoはGitHub Actionsの
# 標準ランナー分数が無償のため、privateで重複して課金対象にする必要がない。
#
# 【highspyのバージョン上書きについて】2026-09-01に削除。
# Backend/requirements.txtからhighspyのピン自体を削除した
# (CE上限MIPフォールバックがortools内蔵HiGHSに切り替わり、単体highspy
# パッケージ自体が不要になったため。詳細はrequirements.txt内のコメントと
# Backend/solvers/base/ce_limit_mip_fallback.py冒頭の【2026-09-01の変更】
# 参照)。highspyが依存関係に含まれなくなったため、以前ここに書かれていた
# Linux固有ABI問題(cpmpy 1.0.0のソルバー検出がhighspy importでクラッシュ
# する件)自体が発生しなくなり、このCI限定のバージョン上書きも不要になった。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies (CPLEX/docplexなし、CP-SATのみ)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          # CP系ドメインの既定ソルバーエンジンをCP-SATに固定(requirements.txt
          # 側のデフォルトと同じだが、CI環境では明示しておく)。
          DEFAULT_SOLVER_ENGINE: cpsat
        run: |
          python -m pytest -v
